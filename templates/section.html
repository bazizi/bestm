{% extends "base.html" %}
{% block content %}
<article class="page">
  <header class="page-header">
    <h1>{{ section.title }}</h1>
  </header>
  <div class="content">
    {{ section.content | safe }}
  </div>

  {% if section.pages %}
  <section class="course-list">
    <h2>Courses</h2>
    <ul class="cards">
      {% for p in section.pages %}
      <li>
        <a href="{{ p.permalink }}">{{ p.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </section>
  {% endif %}
</article>
{% endblock %}
